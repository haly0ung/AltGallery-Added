# altgen config for the Reloc AltStore source.
# Run: uvx altgen -c config.toml
# Reloc: iOS accessory-level location simulator over local loopback
# (iAP2 / MFi-v3 / NMEA), for iPhone and iPad.
#
# NOTE: this app lives in added/ (not apps/) — small-source-only.
# Only the added-apps workflow regenerates and merges it into added-apps.json.
# NOTE: the release IPA is UNSIGNED — sign with your own certificate in your
# signer before installing.

[github]
repo = "Reukix/Reloc"

[source]
name = "Reloc"
subtitle = "Reloc AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for Reloc"
icon_url = "https://raw.githubusercontent.com/haly0ung/AltGallery-Added/refs/heads/master/added/Reloc/icon.png"
website = "https://github.com/Reukix/Reloc"
tint_color = "#0A84FF"

[app]
name = "Reloc"
bundle_identifier = "dev.reloc.ios"
developer_name = "Reukix"
subtitle = "本机虚拟外设定位模拟工具"
description = "本机虚拟外设定位模拟：地图选点、WGS-84 坐标与海拔注入，支持 GCJ-02 纠偏与后台保活。安装前需对 IPA 签名。"
icon_url = "https://raw.githubusercontent.com/haly0ung/AltGallery-Added/refs/heads/master/added/Reloc/icon.png"
tint_color = "#0A84FF"
min_os_version = "17.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): every release ships a single
# asset named Reloc.ipa.
asset_pattern = 'Reloc\.ipa$'

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/haly0ung/AltGallery-Added/refs/heads/master/added/Reloc/images/news.png"

[output]
path = "apps.json"
