# altgen config for the HGhubX AltStore source.
# Run: uvx altgen -c config.toml
# HGhubX: Cross-platform short-drama client
#
# NOTE: this app lives in added/ (not apps/) — layout kept from the fork.
# Only the added-apps workflow regenerates and merges it into added-apps.json.

[github]
repo = "zxsos/HGhubX"

[source]
name = "HGhubX"
subtitle = "HGhubX AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for HGhubX"
icon_url = "https://raw.githubusercontent.com/haly0ung/AltGallery-Added/refs/heads/master/added/HGhubX/icon.png"
website = "https://github.com/zxsos/HGhubX"
tint_color = "#60CDFF"

[app]
name = "HGhubX"
bundle_identifier = "com.hghubx.app"
developer_name = "zxsos"
subtitle = "Cross-platform short-drama client"
description = "Cross-platform short-drama client built with Tauri 2, React and Rust."
icon_url = "https://raw.githubusercontent.com/haly0ung/AltGallery-Added/refs/heads/master/added/HGhubX/icon.png"
tint_color = "#60CDFF"
min_os_version = "15.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# Asset name changed at v2.0.0: HGhub_<ver>_ios.ipa -> HGhubX_<ver>_ios.ipa
asset_pattern = 'HGhubX?_.*_ios\.ipa$'

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/haly0ung/AltGallery-Added/refs/heads/master/added/HGhubX/images/news.png"

[output]
path = "apps.json"
