# altgen config for the Camlo AltStore source.
# Run: uvx altgen -c config.toml
# Camlo: lock-screen morph / 3D depth / motion wallpaper workshop for iOS / iPadOS, no PC/jailbreak

[github]
repo = "Kianuni/Camlo"

[source]
name = "Camlo"
subtitle = "Camlo AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for Camlo"
icon_url = "https://raw.githubusercontent.com/haly0ung/AltGallery-Added/refs/heads/master/apps/Camlo/icon.png"
website = "https://github.com/Kianuni/Camlo"
tint_color = "#6B4EFF"

[app]
name = "Camlo"
bundle_identifier = "com.kianuni.Camlo"
developer_name = "Kianuni"
subtitle = "开幕 · 零门槛「滑动解锁变身 + 动态锁屏」壁纸工坊"
description = "Camlo（开幕）是一款零门槛 iOS / iPadOS 原生 Core Animation (.tendies / CAML) 动态与滑动变身锁屏制作工坊。内置 120Hz 原生 .ca 实时交互试穿、陀螺仪 3D 裸眼视差 (ParameterizedCA)、昼夜双生壁纸 (appearanceAware)、智能时钟配色字体与主屏柔焦配套、6 套内置获奖风光双态预设与 70 套零体积馆藏大师级官方云端壁纸、8 款异形粒子与体积流光特效、AI 主体抠图遮挡时钟、视频/实况抽帧无缝循环与免电脑一键直写 iOS 26 / iOS 27 锁屏画廊。"
icon_url = "https://raw.githubusercontent.com/haly0ung/AltGallery-Added/refs/heads/master/apps/Camlo/icon.png"
tint_color = "#6B4EFF"
min_os_version = "26.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# asset_pattern is a regex (not glob): each release ships one ipa,
# Camlo_v<version>_<language>.ipa (Bilingual since v1.3.0).
asset_pattern = 'Camlo_.*\.ipa$'

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/haly0ung/AltGallery-Added/refs/heads/master/apps/Camlo/images/news.png"

[output]
path = "apps.json"
