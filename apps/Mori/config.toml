# altgen config for the Mori AltStore source.
# Run: uvx altgen -c config.toml
# Mori: Save anything, from anywhere.

[github]
repo = "coflyn/Mori"

[source]
name = "Mori"
subtitle = "Mori AltStore source by AltGallery & AltGen"
description = "Auto-updated AltStore source for Mori"
icon_url = "https://raw.githubusercontent.com/haly0ung/AltGallery-Added/refs/heads/master/apps/Mori/icon.png"
website = "https://github.com/coflyn/Mori"
tint_color = "#27282A"

[app]
name = "Mori"
bundle_identifier = "com.mori.downloader"
developer_name = "coflyn"
subtitle = "Save anything, from anywhere."
description = "Save videos, photos, and audio from 16 platforms with built-in media tools. No watermarks, accounts, or tracking. Everything runs locally on your device."
icon_url = "https://raw.githubusercontent.com/haly0ung/AltGallery-Added/refs/heads/master/apps/Mori/icon.png"
tint_color = "#27282A"
min_os_version = "14.0"

[versions]
strip_v_prefix = true
include_prereleases = false
# Each release contains: Mori-v<version>-iOS-Unsigned.ipa
asset_pattern = 'Mori-v.*-iOS-Unsigned\.ipa$'

[news]
title_template = "{name} {version} · {date}"
# shared promo image rendered by tools/render_news.py
image_url = "https://raw.githubusercontent.com/haly0ung/AltGallery-Added/refs/heads/master/apps/Mori/images/news.png"

[output]
path = "apps.json"
